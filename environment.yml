name: mr_env
# Conda environment for the MR pipeline.
# CRAN packages + PLINK + a build toolchain come from conda; the GitHub-only
# packages (TwoSampleMR, ieugwasr, genetics.binaRies, MR-PRESSO) are installed
# on top by setup_conda_env.sh (they are not on conda-forge).
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.3
  # --- CRAN packages the pipeline uses directly ---
  - r-data.table
  - r-r.utils        # required by data.table::fread to read .gz files
  - r-digest         # strong (xxhash64) cache keys (pipeline falls back if absent)
  - r-readxl         # read .xlsx trait manifests / instrument lists
  - r-dplyr
  - r-optparse
  - r-remotes
  - r-biocmanager
  # --- heavy TwoSampleMR/MR-PRESSO deps, prebuilt to speed the GitHub install ---
  - r-ggplot2
  - r-jsonlite
  - r-curl
  - r-openssl
  - r-xml2
  - r-rcpp
  # --- PLINK 1.9 for LD clumping and the proxy search ---
  - plink
  # --- toolchain for compiling the GitHub R packages ---
  - c-compiler
  - cxx-compiler
  - gfortran
  - make
  - pkg-config
  - git
